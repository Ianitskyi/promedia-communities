name: "➕ Додати медіаспільноту"
description: "Запропонуйте медіа для каталогу медіаспільнот України. Заявка проходить премодерацію команди ПроМедіа перед публікацією."
title: "[Нова спільнота] "
labels: ["new-community", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Дякуємо, що хочете додати медіа до каталогу! Заповніть поля нижче — команда ПроМедіа перевірить заявку і додасть її до `data/communities.json`.
  - type: input
    id: name
    attributes:
      label: Назва медіа
      placeholder: "Наприклад: Суспільне Новини"
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Сайт медіа
      placeholder: "https://example.com"
    validations:
      required: true
  - type: input
    id: community-url
    attributes:
      label: Посилання на спільноту (де підписатися)
      description: "Посилання, за яким можна переказати гроші та долучитися до спільноти"
      placeholder: "https://t.me/example"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Платформа спільноти
      options:
        - telegram
        - facebook
        - instagram
        - youtube
        - viber
        - website
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Короткий опис медіа
      description: "1-2 речення: що це за медіа."
    validations:
      required: true
  - type: textarea
    id: community-idea
    attributes:
      label: Ключова ідея спільноти
      description: "Чому варто підписатися — фокус, місія, унікальність."
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: Місто
      placeholder: "Львів"
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Область
      description: "Медіа на карті прив'язується до області (контурна схематична карта, без точних координат)."
      options:
        - Вінницька область
        - Волинська область
        - Дніпропетровська область
        - Донецька область
        - Житомирська область
        - Закарпатська область
        - Запорізька область
        - Івано-Франківська область
        - м. Київ
        - Київська область
        - Кіровоградська область
        - Луганська область
        - Львівська область
        - Миколаївська область
        - Одеська область
        - Полтавська область
        - Рівненська область
        - Сумська область
        - Тернопільська область
        - Харківська область
        - Херсонська область
        - Хмельницька область
        - Черкаська область
        - Чернівецька область
        - Чернігівська область
        - Автономна Республіка Крим
    validations:
      required: true
  - type: checkboxes
    id: badges
    attributes:
      label: Позначки (якщо застосовно)
      options:
        - label: На мапі рекомендованих медіа
        - label: У білому списку ЗМІ
        - label: Має міжнародний знак JTI (Journalism Trust Initiative)
  - type: checkboxes
    id: tags
    attributes:
      label: Теги (опційно)
      options:
        - label: Розслідувальне медіа
        - label: Воєнна журналістика
        - label: Медіа про культуру
  - type: input
    id: contact
    attributes:
      label: Контакт заявника (email або телефон)
      description: "Щоб ми могли зв'язатися, якщо виникнуть питання щодо заявки."
    validations:
      required: false
